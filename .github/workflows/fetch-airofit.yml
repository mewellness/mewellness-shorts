name: Fetch Airofit source images
on:
  push:
    paths: ['airofit/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p airofit/src
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL -o "airofit/src/$name" "$url"
          done < airofit/urls.txt
          ls -la airofit/src
      - name: Commit
        run: |
          git config user.name "mewellness-bot"
          git config user.email "bot@users.noreply.github.com"
          git add airofit/src
          git commit -m "Fetch Airofit source images" || echo "nothing to commit"
          git push
